version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/workspace/backend/target
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - multiservice-net

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: multiservice_db
      POSTGRES_USER: multiservice
      POSTGRES_PASSWORD: multiservice_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multiservice -d multiservice_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - multiservice-net

volumes:
  postgres-data:
  cargo-cache:
  target-cache:

networks:
  multiservice-net:
    driver: bridge
